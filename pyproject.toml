[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=6.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
preview = true
select = [  # https://docs.astral.sh/ruff/rules
    "E4", "E7", "E9",  # pycodestyle coding rules
    "F",  # Pyflakes
    "B",  # flake8-bugbear
    "I",  # isort
    "N",  # pep8-naming
    "D",  # pydocstyle documentation
    "UP", # pyupgrade
    "ANN001",  # missing type annotation for function arguments
    "ANN201",  # missing type annotation for function return value
    "PL",  # pylint
    "NPY",  # NumPy-specific rules
    "PERF",  # Perflint
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "PLC2701"]  # documenting the unit tests is not necessary

"**/_version.py" = ["RUF022", "UP035", "I001", "UP006"]  # generated by setuptools-scm

[tool.codespell]
skip = ["*.json", "*.html", "*.js", "*.css", "*.c", "*.h", "*.cpp", "*.hpp", "*.xml", "*.stp", "*.step", "*.CATPart",
    "*.fbx", "*.xlsx", "build", "dist", "htmlcov"]
ignore-words-list = ["dessia"]  # words to ignore from codespell check

[tool.coverage.run]
source = ["tutorials"]  # source code directories
omit = ["tutorials/_version.py"]

[tool.coverage.report]
omit = [
    "*/_version.py",
]  # modules to omit from coverage analysis

[coverage]
min_global_coverage = 60  # minimum global coverage percentage
min_module_coverage = 20  # minimum coverage percentage for each module
untracked_scripts = [
    "patterns_generator_workflow.py",
    "script1_tuto7_step.py",
    "tutorial10_workflow.py",
    "workflow1_tuto1_rivetedassembly.py",
    "workflow1_tuto2_powertransmission.py",
    "workflow1_tuto5_piping.py",
    "workflow1_tuto9_ratiogearbox.py",
    "workflow1_tutorial9_gearbox.py",
    "workflow_knapsack.py",
]

[project]
name = "tutorials"
dynamic = ["version"]
description = "Tutorials for DessIA platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Dessia Technologies sAS", email = "ringhausen@dessia.io"},
]
dependencies = [
    "cma",
    "dectree",
    "dessia-common>=1.0.0",
    "datatools",
    "matplotlib",
    "networkx",
    "openpyxl",
    "pandas",
    "plot_data",
    "scikit-learn",
    "scipy",
    "volmdlr>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/Dessia-tech/tutorials"

[project.optional-dependencies]
test = [
    "coverage[toml]>=7.0.0",
    "tomli>=1.2.0",
]
doc = [
    "sphinx>=5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
write_to = "src/tutorials/_version.py"

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "GITLAB"
url = "https://gitlab.com/api/v4/groups/84499690/-/packages/pypi/simple"
authenticate = "always"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
