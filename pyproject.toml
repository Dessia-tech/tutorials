[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tutorials"
description = "tutorials for DessIA platform"
authors = [
    {name = "Dessia Technologies sAS", email = "ringhausen@dessia.io"}
]
requires-python = ">=3.12"
dependencies = [
    # "dessia_common>=1.0.0rc1"
    # "plot_data",
    # "volmdlr>=0.18.0"
    # "datatools",
]
dynamic = ["version"]

[tool.setuptools]
#packages = ["tutorials"]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

 [tool.setuptools_scm]
 write_to = "src/tutorials/_version.py"